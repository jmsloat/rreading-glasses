name: publish Hardcover diagnostics

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable diagnostic image tag
        required: true
        default: hardcover-king-diagnostics.1

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: RGPATH=./cmd/rghc
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
